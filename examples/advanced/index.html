<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>composed-form — advanced example</title>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }
            body {
                font-family: system-ui, sans-serif;
                max-width: 480px;
                margin: 4rem auto;
                padding: 0 1.5rem;
                color: #111;
            }
            h2 {
                margin-top: 0;
            }
            label {
                display: block;
                margin-bottom: 1rem;
            }
            label span {
                display: block;
                font-size: 0.875rem;
                font-weight: 600;
                margin-bottom: 0.25rem;
            }
            input,
            select {
                width: 100%;
                padding: 0.5rem 0.75rem;
                border: 1px solid #d1d5db;
                border-radius: 0.375rem;
                font-size: 1rem;
            }
            input:focus,
            select:focus {
                outline: 2px solid #2563eb;
                outline-offset: 1px;
                border-color: transparent;
            }
            textarea {
                width: 100%;
                padding: 0.5rem 0.75rem;
                border: 1px solid #d1d5db;
                border-radius: 0.375rem;
                font-size: 1rem;
                font-family: inherit;
                resize: vertical;
                min-height: 4rem;
            }
            textarea:focus {
                outline: 2px solid #2563eb;
                outline-offset: 1px;
                border-color: transparent;
            }
            .error {
                color: #dc2626;
                font-size: 0.8rem;
                margin-top: 0.25rem;
            }
            .nav {
                display: flex;
                gap: 0.5rem;
                margin-top: 2rem;
                justify-content: space-between;
                align-items: center;
                border-top: 1px solid #e5e7eb;
                padding-top: 1.25rem;
            }
            .progress {
                font-size: 0.875rem;
                color: #6b7280;
            }
            button {
                padding: 0.5rem 1.25rem;
                border: none;
                border-radius: 0.375rem;
                background: #2563eb;
                color: white;
                font-size: 0.9375rem;
                cursor: pointer;
            }
            button:hover {
                background: #1d4ed8;
            }
            button:disabled {
                opacity: 0.45;
                cursor: not-allowed;
            }
            button.secondary {
                background: #e5e7eb;
                color: #111;
            }
            button.secondary:hover {
                background: #d1d5db;
            }
            pre {
                background: #f9fafb;
                border: 1px solid #e5e7eb;
                padding: 1rem;
                border-radius: 0.5rem;
                font-size: 0.8125rem;
                overflow-x: auto;
            }

            /* ---- Step indicator ---- */
            .step-indicator {
                display: flex;
                position: relative;
                margin-bottom: 2rem;
            }
            .step-indicator::before {
                content: '';
                position: absolute;
                top: 7px;
                left: 8px;
                right: 8px;
                height: 2px;
                background: #e5e7eb;
                z-index: 0;
            }
            .step-dot {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.3rem;
                z-index: 1;
                position: relative;
            }
            .step-dot .dot {
                width: 16px;
                height: 16px;
                border-radius: 50%;
                background: #e5e7eb;
                border: 2px solid #e5e7eb;
                transition:
                    background 0.2s,
                    border-color 0.2s;
            }
            .step-dot.past .dot {
                background: #2563eb;
                border-color: #2563eb;
            }
            .step-dot.current .dot {
                background: white;
                border-color: #2563eb;
                box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            }
            .step-dot span {
                font-size: 0.6875rem;
                color: #9ca3af;
                text-align: center;
                transition: color 0.2s;
            }
            .step-dot.past span,
            .step-dot.current span {
                color: #2563eb;
                font-weight: 600;
            }
            .step-dot .dirty-dot {
                width: 6px;
                height: 6px;
                background: #f59e0b;
                border-radius: 50%;
                position: absolute;
                top: -2px;
                right: calc(50% - 12px);
            }

            /* ---- Review summary ---- */
            .review-hint {
                font-size: 0.875rem;
                color: #6b7280;
                margin-top: -0.5rem;
                margin-bottom: 1.25rem;
            }
            .review-section {
                border: 1px solid #e5e7eb;
                border-radius: 0.5rem;
                overflow: hidden;
                margin-bottom: 0.75rem;
            }
            .review-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0.5rem 0.75rem;
                background: #f9fafb;
                border-bottom: 1px solid #e5e7eb;
                font-size: 0.875rem;
            }
            .review-row {
                display: flex;
                justify-content: space-between;
                padding: 0.5rem 0.75rem;
                font-size: 0.9rem;
                border-bottom: 1px solid #f3f4f6;
            }
            .review-row:last-child {
                border-bottom: none;
            }
            .review-row span:first-child {
                color: #6b7280;
            }
            button.link {
                background: none;
                color: #2563eb;
                padding: 0;
                font-size: 0.8125rem;
                text-decoration: underline;
            }
            button.link:hover {
                color: #1d4ed8;
                background: none;
            }

            /* ---- Radio card group ---- */
            .radio-group {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 0.5rem;
                margin-bottom: 1rem;
            }
            .radio-card {
                padding: 0.625rem;
                border: 1px solid #d1d5db;
                border-radius: 0.375rem;
                text-align: center;
                cursor: pointer;
                font-size: 0.875rem;
                background: white;
            }
            .radio-card:hover {
                border-color: #9ca3af;
            }
            .radio-card.selected {
                border-color: #2563eb;
                background: #eff6ff;
            }

            /* ---- Toggle switch ---- */
            .toggle-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0.5rem 0;
                margin-bottom: 0.5rem;
            }
            .toggle-label {
                font-size: 0.875rem;
                font-weight: 600;
            }
            .toggle {
                position: relative;
                width: 40px;
                height: 22px;
                background: #d1d5db;
                border-radius: 11px;
                border: none;
                cursor: pointer;
                padding: 0;
                transition: background 0.2s;
            }
            .toggle.on {
                background: #2563eb;
            }
            .toggle::after {
                content: '';
                position: absolute;
                top: 2px;
                left: 2px;
                width: 18px;
                height: 18px;
                background: white;
                border-radius: 50%;
                transition: transform 0.2s;
            }
            .toggle.on::after {
                transform: translateX(18px);
            }

            /* ---- Array field rows ---- */
            .field-row {
                display: flex;
                gap: 0.5rem;
                align-items: flex-start;
                margin-bottom: 0.5rem;
            }
            .field-row input,
            .field-row select {
                flex: 1;
            }
            button.remove {
                background: #fee2e2;
                color: #dc2626;
                padding: 0.5rem 0.75rem;
                font-size: 0.8rem;
                flex-shrink: 0;
            }
            button.remove:hover {
                background: #fecaca;
            }
            button.add {
                background: #f0fdf4;
                color: #16a34a;
                font-size: 0.8rem;
                margin-bottom: 1rem;
            }
            button.add:hover {
                background: #dcfce7;
            }

            /* ---- Character count ---- */
            .char-count {
                font-size: 0.75rem;
                color: #9ca3af;
                text-align: right;
                margin-top: 0.125rem;
            }
            .char-count.over {
                color: #dc2626;
            }

            /* ---- Field hint ---- */
            .hint {
                font-size: 0.75rem;
                color: #6b7280;
                margin-top: 0.125rem;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="./app.tsx"></script>
    </body>
</html>
